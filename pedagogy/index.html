    <h1>Semiconductor Theory</h1>

    <h2>P-Type Semiconductor</h2>
    <p>Holes are the majority charge carriers in a P-type semiconductor.</p>

    <h2>N-Type Semiconductor</h2>
    <p>Electrons are the majority charge carriers in an N-type semiconductor.</p>

    <h2>Effect of Temperature</h2>
    <p>Temperature affects the electrical properties of semiconductors.</p>
